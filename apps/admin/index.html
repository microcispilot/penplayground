<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Pen Playground Operations</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- No stamp unless somebody chose: this origin starts empty by design (ADR-0026),
         and stamping "light" there would make the console light for everyone forever. -->
    <script>(()=>{var t=null;try{t=localStorage.getItem("pen.theme")}catch(_){}document.documentElement.setAttribute("data-theme",t==="dark"?"dark":t==="light"?"light":"")})()</script>
    <!-- The same mark as the product: the tab's title is what says Operations. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
