<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Pen Playground</title>
    <!-- Defaults for a crawler that does not run JavaScript; every screen replaces them
         through packages/app/src/lib/seo.ts once the app is up. -->
    <meta
      name="description"
      content="Ask for anything. An expert starts talking within seconds, writes it out on a board at a human pace, and stops the moment you speak."
    />
    <link rel="canonical" href="https://penplayground.com/" />
    <meta property="og:site_name" content="Pen Playground" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pen Playground" />
    <meta
      property="og:description"
      content="Ask for anything. An expert starts talking within seconds, writes it out on a board at a human pace, and stops the moment you speak."
    />
    <meta property="og:url" content="https://penplayground.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Pen Playground" />
    <meta
      name="twitter:description"
      content="Ask for anything. An expert starts talking within seconds, writes it out on a board at a human pace, and stops the moment you speak."
    />
    <script>(()=>{var t=null;try{t=localStorage.getItem("pen.theme")}catch(_){}document.documentElement.setAttribute("data-theme",t==="dark"?"dark":t==="system"?"":"light")})()</script>
    <!-- The mark, generated from the artwork by packages/design/scripts/mark.ts.
         The SVG answers `prefers-color-scheme` itself, because a favicon has no
         document to take its ink from; the PNG is for the clients that will not
         take an SVG, and is the light one. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
