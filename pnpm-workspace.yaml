packages:
  - apps/*
  - services/*
  - packages/*
allowBuilds:
  esbuild: true
  '@biomejs/biome': true
  '@electric-sql/pglite': true
  electron: true
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  electron-winstaller: true
  fs-xattr: true
  macos-alias: true
  core-js: false
blockExoticSubdeps: false
# pnpm's own default, written out because Electron Forge refuses to package a pnpm workspace
# unless a hoist pattern (or node-linker=hoisted) is explicitly configured; the install layout
# is unchanged (apps/desktop ships only its Vite output, never node_modules).
hoistPattern:
  - '*'

