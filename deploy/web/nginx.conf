# Pen Playground web container: serves the Vite build and proxies API paths to the `api` service.
# Loaded as /etc/nginx/conf.d/default.conf inside nginx:1.30-alpine (http context).
# TLS terminates at the host nginx (deploy/nginx/pen-playground.conf.example), which forwards to
# this container on 127.0.0.1:4201 with X-Forwarded-* headers.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Trust the scheme the host proxy reports; fall back to our own when reached directly.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Resolve the api service per request (Docker's embedded DNS) so an api container restart with a
# new address never leaves nginx pinned to a stale IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    set $api http://api:4000;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               image/svg+xml application/wasm font/woff2;

    # ── security headers ───────────────────────────────────────────────────
    # The Content-Security-Policy is generated from apps/web/csp.ts — the single
    # source both this file and the Playwright check read, so the two can never
    # drift (`pnpm --filter @pen/web csp:print`, guarded by apps/web/test/csp.test.ts).
    # Every origin in it is one a real session was observed to use.
    set $pen_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' blob: 'sha256-ovZbG4a1PFqo4OkcQsxwgEDTC3fYoVQQ791T+L28T0w=' https://imasdk.googleapis.com https://*.doubleclick.net https://*.googlesyndication.com https://*.2mdn.net https://accounts.google.com https://us.i.posthog.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://cdn.tldraw.com https://lh3.googleusercontent.com https://imasdk.googleapis.com https://*.doubleclick.net https://*.googlesyndication.com https://*.2mdn.net https://*.google.com; font-src 'self' data: https://cdn.tldraw.com https://fonts.gstatic.com; media-src 'self' blob: data: https://*.googlevideo.com https://*.gvt1.com https://imasdk.googleapis.com https://*.doubleclick.net https://*.googlesyndication.com https://*.2mdn.net; connect-src 'self' https://cdn.tldraw.com https://us.i.posthog.com https://us-assets.i.posthog.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://accounts.google.com https://imasdk.googleapis.com https://*.doubleclick.net https://*.googlesyndication.com https://*.2mdn.net https://csi.gstatic.com https://*.google.com; frame-src https://imasdk.googleapis.com https://*.doubleclick.net https://*.googlesyndication.com https://*.2mdn.net https://accounts.google.com; worker-src 'self' blob:; child-src blob: https://imasdk.googleapis.com https://*.doubleclick.net https://*.googlesyndication.com https://*.2mdn.net; manifest-src 'self'; upgrade-insecure-requests";

    add_header Content-Security-Policy $pen_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), display-capture=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Authorized Digital Sellers (docs/ADS.md): Google's crawler expects text/plain at the root.
    location = /ads.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Crawlers: the static robots.txt ships with the app; the sitemap is the public catalogue,
    # so it comes from the API (which caches it for an hour, as does this response).
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Hashed build output: cache forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        # A location that sets any header of its own loses every inherited one.
        add_header Content-Security-Policy $pen_csp always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Readiness, ahead of the general /api/ rule: the same upstream, but with
    # timeouts a probe can live with. The lesson socket below needs an hour of
    # patience; a healthcheck needs the opposite — a hung API must fail here in
    # seconds, not hold the monitor open. Not logged: it is polled constantly.
    location = /api/ready {
        access_log off;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        # An API that is down must read as unavailable, not as a gateway error.
        proxy_intercept_errors off;
    }

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Expert portraits (immutable, cached by the API's own headers). Only this
    # prefix belongs to the API: `/experts` itself is a screen in the app.
    location ^~ /experts/portraits/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Share pages: crawlers get OG tags, humans are redirected into the app.
    location /s/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Room WebSocket: long-lived, binary audio upstream, no buffering.
    location /ws/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: every other path is the app shell, never cached so a deploy is picked up on reload.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $pen_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), display-capture=(), browsing-topics=()" always;
    }
}
