# Pen Playground operations console container: serves the Vite build and proxies /api to the
# `api` service. Loaded as /etc/nginx/conf.d/default.conf inside nginx:1.30-alpine.
#
# Its own vhost on its own hostname (deploy/nginx/pen-playground-admin.conf.example), reached
# through the host nginx on 127.0.0.1:4202. That separation is the point: the console's
# Content-Security-Policy admits this origin, Google sign-in and Sentry's ingest — and nothing
# else: no ad network, no whiteboard library, no product analytics. Its stored bearer never
# shares an origin with the public site either.
#
# The console is useless until `PEN_ADMIN_EMAILS` names somebody in api.env (ADR-0025): every
# admin route answers 403 to everyone otherwise, so shipping this image changes nothing on its own.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    set $api http://api:4000;

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               image/svg+xml font/woff2;

    # ── security headers ───────────────────────────────────────────────────
    # Deliberately far narrower than the public site's. The console loads Google
    # Identity Services and talks to its own origin; anything else is a mistake.
    # The inline script hash is the theme bootstrap in apps/admin/index.html.
    set $admin_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-ovZbG4a1PFqo4OkcQsxwgEDTC3fYoVQQ791T+L28T0w=' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https://lh3.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-src https://accounts.google.com; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests";

    add_header Content-Security-Policy $admin_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Permissions-Policy "microphone=(), camera=(), geolocation=(), payment=(), usb=(), display-capture=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # A location that sets any header of its own loses every inherited one, so
    # each block below re-declares what it must still send.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nothing here is for a crawler.
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # The API, on this origin, so the browser never makes a cross-origin
    # request and CORS never enters into it.
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Hashed assets are immutable; the shell never is.
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $admin_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $admin_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Permissions-Policy "microphone=(), camera=(), geolocation=(), payment=(), usb=(), display-capture=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        try_files $uri $uri/ /index.html;
    }
}
