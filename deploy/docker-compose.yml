# Pen Playground on prod-app-01 — lives at /srv/pen-playground/docker-compose.yml (deploy/deploy.sh
# copies it there). Everything binds to 127.0.0.1; the host nginx terminates TLS and forwards the
# DOMAIN to the web container, which proxies /api, /experts, /s and /ws to the API internally.
#
# Files next to this one on the host:
#   .env           PEN_IMAGE_TAG (written by deploy.sh) and SEARXNG_SECRET
#   api.env        every API variable (template: api.env.example)
#   postgres.env   POSTGRES_USER/PASSWORD/DB (template: postgres.env.example)
#   data/          API state (sessions ledger, onten packs) — back this up
#   searxng/       settings.yml + the included compose file
#   livekit/       livekit.yaml (no secrets; keys come from .env)
#
# Host ports: 4200 (api) and 4201 (web) — 4100 was already taken on prod-app-01 by another
# node process, 4000 by the onten backend. Postgres 18 mounts its volume at /var/lib/postgresql.
# LiveKit: 127.0.0.1:7880 (signalling, behind nginx at /livekit), 7881/tcp and 7882/udp public
# (media) — see docs/DEPLOY.md → "Rooms audio (LiveKit)".

name: pen-playground

include:
  - path: ./searxng/docker-compose.yml
    env_file: ./.env

services:
  api:
    image: pen-playground-api:${PEN_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - ./api.env
    environment:
      NODE_ENV: production
      PEN_PORT: "4000"
      PEN_DATA_DIR: /data
      # MP4 export renders the replay page headlessly; reach the web container directly rather
      # than going out through the public edge. Only effective on an image built with
      # --build-arg WITH_RENDER=1 (docs/DEPLOY.md → "MP4 export (render)").
      PEN_RENDER_BASE_URL: http://web
      # Human-to-human audio: browsers reach LiveKit through the host nginx (/livekit); the API
      # reaches its HTTP API directly. Keys are generated once by deploy.sh into .env and shared
      # with the livekit service below, so they are never typed twice.
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    # Headless Chromium needs more than Docker's 64 MB default /dev/shm (the image also passes
    # --disable-dev-shm-usage; this keeps large boards from falling back to disk).
    shm_size: 1g
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:4200:4000"
    # /api/ready, not /api/health: health says "the process is up and this is
    # its configuration" and stays 200 through an outage on purpose, while
    # ready fails when the database, the data volume or the provider keys are
    # unusable — which is exactly when this container should stop being fed.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PEN_PORT||4000)+'/api/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      livekit:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    image: pen-playground-web:${PEN_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4201:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  livekit:
    # Tag verified on Docker Hub (livekit/livekit-server) on 2026-09-17.
    image: livekit/livekit-server:v1.9.12
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # "<api key>: <api secret>" — the same pair the API signs join tokens with.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    # Tag verified on Docker Hub (library/postgres = 18.6) on 2026-09-16.
    image: postgres:18
    restart: unless-stopped
    env_file:
      - ./postgres.env
    volumes:
      - pen-postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-pen}\" -d \"$${POSTGRES_DB:-pen}\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── backups (profile: backup) ───────────────────────────────────────────────
  # Nightly pg_dump + a tarball of /data into /srv/pen-playground/backups, kept
  # for PEN_BACKUP_KEEP_DAYS, optionally copied off-host with rclone. It is in a
  # profile so `docker compose up -d` (the deploy path) never starts it by
  # accident and `--profile backup` is an explicit choice; deploy.sh passes it.
  #
  #   docker compose --profile backup up -d backup                  # run the schedule
  #   docker compose --profile backup run --rm backup /backup.sh    # one now
  #   docker compose --profile backup run --rm backup /restore.sh 2026-09-17
  #
  # postgres:18-alpine: pg_dump must not be older than the server it dumps.
  backup:
    image: postgres:18-alpine
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    env_file:
      - ./postgres.env
    environment:
      POSTGRES_HOST: postgres
      PEN_BACKUP_KEEP_DAYS: ${PEN_BACKUP_KEEP_DAYS:-14}
      # e.g. "hetzner:pen-playground" for a Storage Box over SFTP; unset = local
      # only. The remote itself is defined in ./backup/rclone.conf (chmod 600).
      PEN_BACKUP_RCLONE_REMOTE: ${PEN_BACKUP_RCLONE_REMOTE:-}
      RCLONE_CONFIG: /rclone/rclone.conf
      PEN_BACKUP_CRON: ${PEN_BACKUP_CRON:-15 3 * * *}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backup/restore.sh:/restore.sh:ro
      - ./backup/entrypoint.sh:/entrypoint.sh:ro
      - ./backups:/backups
      # Writable: the nightly run only reads it, but restore.sh unpacks into it
      # through the same mount (see docs/RUNBOOK.md → "Restore").
      - ./data:/data
      - ./backup/rclone:/rclone:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pen-postgres:
