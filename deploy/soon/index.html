    <style>
      /* One page, no build, no fonts to fetch: it renders instantly and cannot break. */
      :root {
        color-scheme: light dark;
        --bg: #fbfaf7;
        --fg: #0c2c47;
        --fg-2: #4a5a6a;
        --fg-3: #8b96a2;
        --accent: #007f97;
        --aqua: #97d3cd;
        --line: rgba(12, 44, 71, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a121c;
          --fg: #f1f5f8;
          --fg-2: #a9b6c2;
          --fg-3: #6c7a87;
          --accent: #6ec6d8;
          --line: rgba(236, 244, 250, 0.14);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text",
          "Segoe UI", Roboto, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 100svh;
        text-align: center;
      }
      /* One soft light behind the mark, and nothing else on the page. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(44% 36% at 50% 36%, color-mix(in oklch, var(--accent) 15%, transparent), transparent 70%);
      }
      main {
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 1.4rem;
        padding: 2rem 1.5rem;
      }
      .mark { display: flex; align-items: center; gap: 0.6rem; }
      .mark svg { width: 30px; height: 30px; }
      .mark span { font-size: 1.55rem; font-weight: 600; letter-spacing: -0.045em; }
      h1 {
        margin: 0.7rem 0 0;
        font-size: clamp(2rem, 5.6vw, 3rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }
      .rule { width: 44px; height: 3px; border-radius: 999px; background: var(--aqua); }
      /* The single claim the page makes. */
      p {
        margin: 0;
        max-width: 29rem;
        font-size: 1rem;
        line-height: 1.55;
        color: var(--fg-2);
        text-wrap: balance;
      }
      footer {
        padding: 1.5rem;
        font-size: 0.78rem;
        color: var(--fg-3);
        border-top: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5.5 18.5 15.2 8.8a2.2 2.2 0 0 1 3.1 0l.4.4a2.2 2.2 0 0 1 0 3.1L9 22l-4.3 1 1-4.5Z" fill="currentColor" />
          <circle cx="17.5" cy="5" r="2.6" fill="var(--aqua)" />
        </svg>
        <span>Pen Playground</span>
      </div>

      <h1>Coming soon</h1>
      <span class="rule"></span>
      <p>Learn anything from an expert who explains it.</p>
    </main>

    <footer>© 2026 Microcis</footer>
  </body>
</html>
