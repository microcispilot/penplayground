# Staging (ADR-0059): where a change is tried before it is promoted to production.
# Sourced by deploy/deploy.sh; KEY=VALUE lines only, no secrets. The secrets live on the
# host in /srv/pen-staging/{api.env,postgres.env}.
PEN_ENVIRONMENT=staging
PEN_DOMAIN=sdjust.penplayground.com
# 1 also answers on www.DOMAIN and redirects it to the apex; 0 for a subdomain.
PEN_WWW=0
PEN_STACK=pen-staging
PEN_DEPLOY_ROOT=/srv/pen-staging
PEN_API_PORT=4200
PEN_WEB_PORT=4201
PEN_ADMIN_PORT=4202
PEN_PG_PORT=5432
PEN_SEARXNG_PORT=8080
# Kept out of every index: X-Robots-Tag on every response, robots.txt disallows all, no sitemap.
PEN_INDEXABLE=0
# The media host (ADR-0043), shared by both environments with a key pair each.
PEN_LIVEKIT_HOST=10.10.0.4
# Off-host copy of the nightly backup: one folder per environment on the Storage Box.
PEN_BACKUP_RCLONE_REMOTE=hetzner:pen-staging
# Links handed out while staging lived under a path prefix (2026-09-18 to 2026-09-26) keep
# working: /testingxyzbdc/... is redirected to the same path at the root.
PEN_LEGACY_PREFIX=/testingxyzbdc
