# Production (ADR-0059): what the public reaches at the apex. Only ever deployed by promoting
# the image staging runs (`deploy/deploy.sh production --promote`), never built for itself.
# Sourced by deploy/deploy.sh; KEY=VALUE lines only, no secrets. The secrets live on the
# host in /srv/pen-production/{api.env,postgres.env}.
PEN_ENVIRONMENT=production
PEN_DOMAIN=penplayground.com
PEN_WWW=1
PEN_STACK=pen-production
PEN_DEPLOY_ROOT=/srv/pen-production
PEN_API_PORT=4300
PEN_WEB_PORT=4301
PEN_ADMIN_PORT=4302
PEN_PG_PORT=5433
PEN_SEARXNG_PORT=8081
PEN_INDEXABLE=1
# Public: the gate is for staging (ADR-0061); the product answers everyone.
PEN_EDGE_GATE=0
PEN_LIVEKIT_HOST=10.10.0.4
PEN_BACKUP_RCLONE_REMOTE=hetzner:pen-production
PEN_LEGACY_PREFIX=
