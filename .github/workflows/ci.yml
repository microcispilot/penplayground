name: CI

# Every push to a mainline branch and every pull request. The gate is the same
# one a developer runs (`pnpm verify`, then the Playwright e2e against fake
# providers), plus a build of both production images so a bundling mistake is
# caught here rather than on the host.
on:
  push:
    branches: [main, 'release/**']
  pull_request:

# A new push to the same ref makes the previous run pointless: cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo prints progress rather than redrawing a TUI nobody is watching.
  TURBO_UI: 'false'
  # Never let a stray token or a missing value turn into a live provider call.
  PEN_LLM_PROVIDER: fake
  PEN_TTS_PROVIDER: silent

jobs:
  verify:
    name: verify (lint · typecheck · tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      # Not `engines.node` (>=22.13.0): that is a floor, and pnpm 11.0.8 refuses
      # to start on anything below 22.13 ("This version of pnpm requires at
      # least Node.js v22.13"). Pinned to the version the work is tested on.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API's integration tests are the real thing: `export.integration`
      # renders a session with Chromium and inspects the MP4 with ffprobe, and
      # the bundle test boots `dist/main.js`. Both dependencies exist here, so
      # neither test is allowed to skip itself — PEN_SKIP_INTEGRATION stays unset.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm verify

  e2e:
    name: e2e (Playwright, fake providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The specs drive AudioWorklet with fake media devices, which the
      # headless shell crashes on: the config pins `channel: chromium`, so the
      # full build is what has to be installed.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm --filter @pen/web e2e
        env:
          CI: 'true'
          # ads.spec.ts plays a real creative from Google's public IMA sample
          # tag — a genuine network path, on purpose. The spec skips itself when
          # that tag cannot be reached, so a blocked runner never fails the build.
          PEN_AD_TEST_TAGS: '1'

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            .pen-data/screens/
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: docker images (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built, never pushed: this job exists to catch a broken bundle, a missing
      # external, or a base image that moved — the same two images deploy.sh
      # ships. WITH_RENDER=1 is what production runs (Playwright + ffmpeg), so
      # it is what gets built.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            WITH_RENDER=1
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
