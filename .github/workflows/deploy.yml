name: Deploy

# Two environments, one path (ADR-0059).
#
#   staging     every push to main that passes CI is built once and deployed to staging.
#   production  a person presses "Run workflow": production takes exactly the image staging
#               runs (`deploy/deploy.sh production --promote`). The `production` environment
#               in GitHub carries the required-reviewer rule, so the run waits for approval.
#
# The runner reaches prod-app-01 the way the workstation does: over Tailscale, with an SSH
# key that only this workflow holds. Secrets never leave the host: the deploy writes the
# environment's identity (URLs, ports, tag) and forwards nothing from here except the web
# build arguments, which are public values baked into the bundle.
#
# Secrets (repository): DEPLOY_SSH_KEY (ed25519 private key), DEPLOY_KNOWN_HOSTS (the host's
# keys, `ssh-keyscan 100.118.252.64`), TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET (a Tailscale OAuth
# client with the `ci` tag), SENTRY_AUTH_TOKEN, VITE_TLDRAW_LICENSE_KEY, VITE_SENTRY_DSN,
# VITE_POSTHOG_TOKEN, VITE_POSTHOG_HOST, VITE_GOOGLE_CLIENT_ID.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [production, staging]
        default: production
      tag:
        description: Image tag to deploy (production only; blank = promote what staging runs)
        required: false
        default: ''

# Deploys never overlap and are never cancelled half-way: a stack half-updated is worse
# than one updated late.
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  PEN_DEPLOY_HOST: root@100.118.252.64
  PEN_DEPLOY_SSH_IDENTITY_FILE: ${{ github.workspace }}/.deploy/id_ed25519
  PEN_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ github.workspace }}/.deploy/known_hosts

jobs:
  staging:
    name: deploy staging
    # A push to main whose CI passed, or a person asking for staging by hand.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: staging
      url: https://sdjust.penplayground.com/
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI just passed, not whatever main has moved on to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - name: Connect to the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install the deploy key
        run: |
          mkdir -p .deploy && chmod 700 .deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" > .deploy/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > .deploy/known_hosts
          chmod 600 .deploy/id_ed25519 .deploy/known_hosts
          sudo apt-get install -y --no-install-recommends zstd rsync >/dev/null
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Build, ship and deploy to staging
        run: deploy/deploy.sh staging
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pen-playground
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.VITE_TLDRAW_LICENSE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_TOKEN: ${{ secrets.VITE_POSTHOG_TOKEN }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

  production:
    name: deploy production (promote)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The environment's protection rule (a required reviewer) is what holds the run here
    # until somebody approves it; nothing below runs before that.
    environment:
      name: production
      url: https://penplayground.com/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Connect to the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install the deploy key
        run: |
          mkdir -p .deploy && chmod 700 .deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" > .deploy/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > .deploy/known_hosts
          chmod 600 .deploy/id_ed25519 .deploy/known_hosts
          sudo apt-get install -y --no-install-recommends zstd rsync >/dev/null
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # No build, no ship: production runs what staging runs, or an explicit tag the host
      # already has (a rollback). Both leave the images untouched.
      - name: Promote staging to production
        if: github.event.inputs.tag == ''
        run: deploy/deploy.sh production --promote

      - name: Deploy the given tag to production (rollback)
        if: github.event.inputs.tag != ''
        run: deploy/deploy.sh production --tag "$TAG" --skip-build --skip-ship
        env:
          TAG: ${{ github.event.inputs.tag }}
