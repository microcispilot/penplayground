name: Deploy

# Two environments, one path (ADR-0059).
#
#   staging     every push to main that passes CI is built once and deployed to staging.
#   production  a person presses "Run workflow": production takes exactly the image staging
#               runs (`deploy/deploy.sh production --promote`). The `production` environment
#               in GitHub carries the required-reviewer rule, so the run waits for approval.
#
# The runner reaches prod-app-01 the way the workstation does: over Tailscale, with an SSH
# key that only this workflow holds. Secrets never leave the host: the deploy writes the
# environment's identity (URLs, ports, tag) and forwards nothing from here except the web
# build arguments, which are public values baked into the bundle.
#
# Variables (repository): DEPLOY_ENABLED=true turns both jobs on.
# Secrets (repository): DEPLOY_SSH_KEY (ed25519 private key), DEPLOY_KNOWN_HOSTS (the host's
# keys, `ssh-keyscan 100.118.252.64`), TS_AUTHKEY (a Tailscale auth key; see the step below),
# SENTRY_AUTH_TOKEN, VITE_TLDRAW_LICENSE_KEY, VITE_SENTRY_DSN, VITE_POSTHOG_TOKEN,
# VITE_POSTHOG_HOST, VITE_GOOGLE_CLIENT_ID.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [production, staging]
        default: production
      tag:
        description: Image tag to deploy (production only; blank = promote what staging runs)
        required: false
        default: ''

# Deploys never overlap and are never cancelled half-way: a stack half-updated is worse
# than one updated late.
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  PEN_DEPLOY_HOST: root@100.118.252.64
  # Outside the checkout: a file in the workspace is in every Docker build context and makes
  # `git status` dirty, which named the images "<sha>-dirty" (2026-09-26).
  PEN_DEPLOY_SSH_IDENTITY_FILE: ${{ runner.temp }}/deploy/id_ed25519
  PEN_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/deploy/known_hosts

jobs:
  staging:
    name: deploy staging
    # A push to main whose CI passed, or a person asking for staging by hand.
    # DEPLOY_ENABLED (a repository variable) is the switch: unset until the Tailscale OAuth client
    # exists, so a push does not produce a failing run that never reached the host.
    if: >-
      vars.DEPLOY_ENABLED == 'true'
      && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: staging
      url: https://sdjust.penplayground.com/
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI just passed, not whatever main has moved on to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      # An auth key from the admin console (TS_AUTHKEY): it must be REUSABLE, ephemeral and
      # pre-authorized, or the first run spends it and every later run is refused with "invalid
      # key" (2026-09-26). Auth keys also expire (90 days at most). An OAuth client
      # (oauth-client-id / oauth-secret, tag:ci) never expires and is the better long-term choice.
      - name: Connect to the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: pen-ci

      # The action reports success even when the key was refused ("invalid key" in its log),
      # and the deploy would then die at its first ssh with nothing said about why. Say it here.
      # Two different failures, told apart: the runner never joined (the key was refused; the
      # status below says "Logged out"), or it joined and the host's SSH port is not answering
      # yet (a relayed path can take a little while to come up, so this waits up to 90 s).
      - name: Check the host is reachable over the tailnet
        run: |
          if ! tailscale status --self --peers=false >/dev/null 2>&1; then
            echo "::error::The runner is not on the tailnet: the TS_AUTHKEY secret was refused. An auth key must be REUSABLE (and ephemeral, pre-authorized) or it is spent by the first run. Mint one at https://login.tailscale.com/admin/settings/keys and run: gh secret set TS_AUTHKEY"
            tailscale status || true
            exit 1
          fi
          for i in $(seq 1 18); do
            if timeout 5 bash -c '</dev/tcp/100.118.252.64/22' 2>/dev/null; then
              echo "prod-app-01 answers on :22 (after $i attempt(s))"
              tailscale ping -c 1 --timeout 5s 100.118.252.64 || true
              exit 0
            fi
            sleep 5
          done
          echo "::error::Joined the tailnet, but prod-app-01 (100.118.252.64) did not answer on :22 within 90 s. Is the host up, and is it still on the tailnet?"
          tailscale ping -c 3 --timeout 5s 100.118.252.64 || true
          tailscale status || true
          exit 1
      - name: Install the deploy key
        run: |
          mkdir -p "$RUNNER_TEMP/deploy" && chmod 700 "$RUNNER_TEMP/deploy"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy/id_ed25519" "$RUNNER_TEMP/deploy/known_hosts"
          sudo apt-get install -y --no-install-recommends zstd rsync >/dev/null
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Build, ship and deploy to staging
        run: deploy/deploy.sh staging
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pen-playground
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.VITE_TLDRAW_LICENSE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_TOKEN: ${{ secrets.VITE_POSTHOG_TOKEN }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

  production:
    name: deploy production (promote)
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The environment's protection rule (a required reviewer) is what holds the run here
    # until somebody approves it; nothing below runs before that.
    environment:
      name: production
      url: https://penplayground.com/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # An auth key from the admin console (TS_AUTHKEY): it must be REUSABLE, ephemeral and
      # pre-authorized, or the first run spends it and every later run is refused with "invalid
      # key" (2026-09-26). Auth keys also expire (90 days at most). An OAuth client
      # (oauth-client-id / oauth-secret, tag:ci) never expires and is the better long-term choice.
      - name: Connect to the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: pen-ci

      # The action reports success even when the key was refused ("invalid key" in its log),
      # and the deploy would then die at its first ssh with nothing said about why. Say it here.
      # Two different failures, told apart: the runner never joined (the key was refused; the
      # status below says "Logged out"), or it joined and the host's SSH port is not answering
      # yet (a relayed path can take a little while to come up, so this waits up to 90 s).
      - name: Check the host is reachable over the tailnet
        run: |
          if ! tailscale status --self --peers=false >/dev/null 2>&1; then
            echo "::error::The runner is not on the tailnet: the TS_AUTHKEY secret was refused. An auth key must be REUSABLE (and ephemeral, pre-authorized) or it is spent by the first run. Mint one at https://login.tailscale.com/admin/settings/keys and run: gh secret set TS_AUTHKEY"
            tailscale status || true
            exit 1
          fi
          for i in $(seq 1 18); do
            if timeout 5 bash -c '</dev/tcp/100.118.252.64/22' 2>/dev/null; then
              echo "prod-app-01 answers on :22 (after $i attempt(s))"
              tailscale ping -c 1 --timeout 5s 100.118.252.64 || true
              exit 0
            fi
            sleep 5
          done
          echo "::error::Joined the tailnet, but prod-app-01 (100.118.252.64) did not answer on :22 within 90 s. Is the host up, and is it still on the tailnet?"
          tailscale ping -c 3 --timeout 5s 100.118.252.64 || true
          tailscale status || true
          exit 1
      - name: Install the deploy key
        run: |
          mkdir -p "$RUNNER_TEMP/deploy" && chmod 700 "$RUNNER_TEMP/deploy"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy/id_ed25519" "$RUNNER_TEMP/deploy/known_hosts"
          sudo apt-get install -y --no-install-recommends zstd rsync >/dev/null
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # No build, no ship: production runs what staging runs, or an explicit tag the host
      # already has (a rollback). Both leave the images untouched.
      - name: Promote staging to production
        if: github.event.inputs.tag == ''
        run: deploy/deploy.sh production --promote

      - name: Deploy the given tag to production (rollback)
        if: github.event.inputs.tag != ''
        run: deploy/deploy.sh production --tag "$TAG" --skip-build --skip-ship
        env:
          TAG: ${{ github.event.inputs.tag }}
